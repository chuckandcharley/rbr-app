<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready Bag Rally</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:400,600,700,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#00b0ff;--gold:#00b0ff;--bg:#002d50;
  --ff:'Source Sans 3','Arial Narrow',Arial,sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--ff);overflow:hidden;color:#fff;}

#layout{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;position:relative;z-index:1;padding:64px;}

#event-label{font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:18px;}
#total-label{
  font-size:clamp(48px,6vw,96px);font-weight:600;letter-spacing:.06em;
  color:rgba(255,255,255,.4);line-height:1;text-align:center;
  margin-bottom:16px;
}
/* The lower bound used to be 200px, set when the number topped out at
   "1,000" — five glyphs. "16,000" is six, so on any window under about
   900px the number pushed past the padding and got clipped by
   overflow:hidden. Only the min changed; on a wall display 22vw still
   wins, so the projected size is exactly as before. */
#total-num{
  font-size:clamp(96px,22vw,420px);font-weight:900;letter-spacing:-.04em;
  color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-align:center;
  transition:transform .12s cubic-bezier(0.34,1.6,0.64,1);
}
#total-num.bump{transform:scale(1.05);}
/* The line the boss cares about: full white, and scaling with the
   viewport like the label above it rather than sitting at a fixed
   size. It's now the brightest thing on the board after the number
   itself — the label above it stays at 40% white, which is what puts
   the message above the framing in the hierarchy. No celebration
   state needed here any more; it reads at full strength all the
   time. */
#total-goal{
  font-size:clamp(34px,3.8vw,76px);font-weight:700;
  color:#fff;margin-top:16px;text-align:center;
}

#progress-wrap{width:100%;max-width:900px;margin-top:56px;}
#progress-track{height:18px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
#progress-fill{height:100%;background:var(--blue);border-radius:99px;width:0%;transition:width .6s cubic-bezier(0.4,0,0.2,1);}
#progress-pct{font-size:22px;font-weight:700;color:rgba(255,255,255,.4);margin-top:14px;letter-spacing:.06em;text-align:right;}

/* SPONSOR LOGO
   Now the all-white version of the wordmark, which sits directly on the
   board background at full contrast — so the white plate that used to
   rescue the navy full-colour asset is gone, along with its padding,
   radius and shadow. The element is kept purely as a centring wrapper.
   The image is embedded as a data URI, so this file still deploys on
   its own with no second asset to host. */
#sponsor-plate{
  margin-top:clamp(20px,3.4vh,44px);
  display:flex;align-items:center;justify-content:center;
}
/* Sized by height rather than width, so the plate scales against the
   vertical space it shares with the number, not against window width.
   The 150px ceiling is about a third of the capped number height —
   bigger than a sponsor lockup usually wants, but it reads from the
   back of the room, which is the point. */
#sponsor-plate img{display:block;height:clamp(44px,11vh,150px);width:auto;}

/* Same reasoning as the min on #total-num: on a short viewport the board
   already nearly fills the height, so the plate gives way instead of
   pushing the top of the stack into overflow:hidden. */
@media (max-height:800px){
  #sponsor-plate{margin-top:11px;}
  #sponsor-plate img{height:48px;}
}

/* Spot-checking the display on a phone shouldn't look broken. The logo
   needs its own cap here: 11vh of a tall phone is wider than the
   padded column, and a four-to-one lockup runs out of width long
   before it runs out of height. */
@media (max-width:700px){
  #layout{padding:24px;}
  #total-goal{font-size:28px;}
  #progress-wrap{margin-top:32px;}
  #sponsor-plate img{height:56px;}
}

/* CELEBRATION SPOTLIGHT
   ────────────────────────────────────────────────────────────
   No confetti, and not for want of trying. Four versions of it were
   built (canvas, 90 CSS layers, 3 searchlights, cached sheets) and
   all four behaved identically: smooth on the computer, steppy on
   the wall. The wall is a MIRRORED display, so the page is already
   smooth by the time anything leaves the machine and the stutter is
   added downstream, where no amount of code can reach it. The one
   thing that always looked right on the panels was the static
   light, because a still image has no frames to drop and a
   low framerate mirror carries it perfectly.

   So the celebration is light, and it holds. If the wall ever gets
   a wired, non mirrored feed, falling confetti becomes possible
   again and it's worth revisiting: see display-10.html in the
   project history for a working implementation.

   Everything here is opacity only. No transforms animating, no
   gradients being re rasterised, no filter:blur(), which at this
   size is the most expensive thing we could ask for. The soft edges
   come from stacked radial gradients that reach zero before any
   element boundary.

   It's deliberately much stronger than the earlier version, which
   read as timid. Two reasons it now doesn't: the beam and pool are
   roughly half again as bright, and there's a vignette darkening
   the corners. The vignette is what does the heavy lifting, because
   brightness is perceived by contrast, and dimming the edges makes
   the centre look lit rather than merely pale.

   It sits BEHIND #layout, so it reads as light falling on the board
   rather than a veil over the text. */
#spotlight{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:none;contain:layout paint;
}

/* Corners pulled down first, so the light has something to be
   brighter than. */
#spotlight .vignette{
  position:absolute;inset:0;
  background:radial-gradient(62% 62% at 50% 44%,
    rgba(0,18,34,0) 0%,
    rgba(0,18,34,.30) 66%,
    rgba(0,18,34,.55) 100%);
  opacity:0;transition:opacity 820ms ease-out;
}

/* The shaft, narrow and bright where it enters at the top and
   spreading as it comes down. */
#spotlight .beam{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(1800px,112vw);height:min(900px,86vh);
  background:
    radial-gradient(13% 15% at 50% -1%, rgba(216,241,255,.40) 0%, rgba(216,241,255,0) 70%),
    radial-gradient(23% 25% at 50% 19%, rgba(216,241,255,.23) 0%, rgba(216,241,255,0) 74%),
    radial-gradient(38% 30% at 50% 46%, rgba(216,241,255,.145) 0%, rgba(216,241,255,0) 76%),
    radial-gradient(54% 33% at 50% 72%, rgba(216,241,255,.085) 0%, rgba(216,241,255,0) 78%);
  opacity:0;transition:opacity 780ms ease-out 140ms;
}

/* The pool where it lands, under the number and the message. Staged
   last so the light reads as travelling down rather than everything
   switching on at once. Staggered delays cost nothing. */
#spotlight .pool{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:min(1560px,94vw);height:min(660px,56vh);
  background:radial-gradient(50% 50% at 50% 50%,
    rgba(216,241,255,.20) 0%,
    rgba(216,241,255,.08) 52%,
    rgba(216,241,255,0) 100%);
  opacity:0;transition:opacity 900ms ease-out 400ms;
}

#spotlight.lit .vignette,#spotlight.lit .beam,#spotlight.lit .pool{opacity:1;}

/* ?fade=0 snaps straight to the lit state with no transition at all,
   in case even the fade misbehaves on the day. */
#spotlight.nofade .vignette,#spotlight.nofade .beam,#spotlight.nofade .pool{transition:none;}

/* Deliberately NO prefers-reduced-motion rule. This is a public
   scoreboard on a wall: nobody watching it has an OS preference that
   applies, while the signage player plausibly does, and honouring it
   would mean the celebration silently failing at the one moment that
   matters. Use ?spotlight=0 to turn it off on purpose instead. */

/* CONNECTION */
#conn{position:fixed;bottom:14px;right:16px;width:8px;height:8px;border-radius:50%;background:#3a3;transition:background .3s;}
#conn.off{background:#a33;}

/* Rehearsal-only readout (?debug=1). Never shown on the live URL. */
#debug{
  position:fixed;bottom:12px;left:16px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.35);letter-spacing:.04em;display:none;
  font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.5;
}
</style>
</head>

<div id="conn"></div>
<div id="debug"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://advjuonmfxpjxxgmoycx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdmp1b25tZnhwanh4Z21veWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NzkyMjQsImV4cCI6MjA5NTU1NTIyNH0.hgAlqocR8DSTHNGg_fdG6nWW6NQ6t_K2RD7D4sdXPGc';

/* ── EVENT CONFIG ──
   Everything that can change on the day — the goal, which row is the
   host's hidden pad — lives in the `event_config` row in Supabase, so
   the wall display never needs re-deploying to change it. */

let counts = {};          // keyed by line id, so any number of lines works
let lastTotal = -1;
let lastPct = '';
let lastBump = 0;
let celebrationFired = false;

let cfg = { goal: 16000, force: false, hostLine: 41, floorCap: 15995 };
let goalOverride = null;  // set by ?goal=N for rehearsals
let dbg = null;           // set by ?debug=1
let dbgBase = '';         // counts line, written by applyState
let dbgCf = '';           // player line, written by the frame meter

function renderDebug() {
  if (!dbg) return;
  dbg.textContent = dbgCf ? dbgBase + '\n' + dbgCf : dbgBase;
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* ── Data ────────────────────────────────────────────────── */

async function loadAll() {
  const [lines, board] = await Promise.all([
    sb.from('lines').select('id, count').order('id'),
    sb.rpc('scoreboard')
  ]);

  if (lines.error) console.error(lines.error);
  else if (lines.data) {
    /* Rebuild rather than merge, so a row deleted in Supabase actually
       disappears from the board instead of lingering in the total. */
    const fresh = {};
    lines.data.forEach(r => { fresh[r.id] = r.count || 0; });
    counts = fresh;
  }

  if (board.error) console.error(board.error);
  else if (board.data) applyConfig(board.data);

  applyState();
}

function applyConfig(s) {
  if (!s) return;
  cfg.goal     = goalOverride || s.goal || 16000;
  cfg.force    = !!s.force_celebrate;
  cfg.hostLine = s.host_line ?? 41;
  cfg.floorCap = s.floor_cap ?? cfg.goal;
}

const conn = document.getElementById('conn');

sb.channel('rbr-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'lines' },
    (payload) => {
      /* '*' rather than 'UPDATE' so a row added mid-event — the host line,
         a row someone forgot to seed — starts counting without needing the
         display refreshed. DELETE carries no payload.new, hence the guard. */
      const row = payload.new;
      if (!row || row.id == null) return;
      counts[row.id] = row.count || 0;
      scheduleApply();
    }
  )
  .on('postgres_changes', { event: '*', schema: 'public', table: 'event_config' },
    (payload) => { if (payload.new) loadAll(); }
  )
  .subscribe((status) => {
    conn.classList.toggle('off', status !== 'SUBSCRIBED');
  });

/* 41 lines tapping at once can land dozens of realtime events per second,
   and the old code ran a full repaint on every one. This collapses a
   burst into one repaint per frame — same numbers, none of the thrash. */
let applyQueued = false;
function scheduleApply() {
  if (applyQueued) return;
  applyQueued = true;
  requestAnimationFrame(() => { applyQueued = false; applyState(); });
}

function applyState() {
  const goal = cfg.goal || 16000;
  let sum = 0;
  for (const k in counts) sum += counts[k] || 0;
  const total = Math.min(sum, goal);

  if (total !== lastTotal) {
    const el = document.getElementById('total-num');
    el.textContent = total.toLocaleString();
    /* Throttled past the 220ms animation. Un-throttled, a heavy rush
       re-added the class before the old timer cleared it and the number
       just sat at 1.05 scale for the whole push, so the pop stopped
       reading as a pop. */
    const now = performance.now();
    if (now - lastBump > 240) {
      lastBump = now;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 220);
    }
  }

  const pct = Math.min(100, (total / goal) * 100);
  const pctStr = pct.toFixed(1) + '%';
  if (pctStr !== lastPct) {
    lastPct = pctStr;
    document.getElementById('progress-fill').style.width = pct.toFixed(2) + '%';
    document.getElementById('progress-pct').textContent = pctStr;
  }

  const shouldCelebrate = total >= goal || cfg.force;
  if (shouldCelebrate && !celebrationFired) {
    celebrationFired = true;
    startCelebration();
  } else if (!shouldCelebrate && celebrationFired) {
    celebrationFired = false;
    stopCelebration();
  }

  if (dbg) {
    const host = counts[cfg.hostLine] || 0;
    dbgBase =
      'floor ' + (sum - host).toLocaleString() +
      ' · host ' + host.toLocaleString() +
      ' · floor stops at ' + cfg.floorCap.toLocaleString() +
      ' · goal ' + goal.toLocaleString();
    renderDebug();
  }

  lastTotal = total;
}

/* ════════════════════════════════════════════════════════════
   CELEBRATION
   ────────────────────────────────────────────────────────────
   Two class toggles and a timer. There is no per frame JavaScript
   here, nothing to build, and nothing to re-measure on resize or
   fullscreen: every dimension in the CSS is vh/vw, so the browser
   handles it. See the CSS block for why the celebration is light
   rather than confetti.
   ════════════════════════════════════════════════════════════ */

let spotlightOn = true;   // ?spotlight=0 turns the celebration off
let spotFade = true;      // ?fade=0 snaps to lit with no transition
let spotTimer = null;

function startCelebration() {
  const el = document.getElementById('spotlight');
  if (!el || !spotlightOn) return;

  clearTimeout(spotTimer);
  el.style.display = 'block';

  if (!spotFade) { el.classList.add('lit'); return; }

  /* Two frames, not one. display:none to block and the class flip in
     the same frame get coalesced into a single style resolution, the
     browser never sees opacity:0 as a starting value, and there is no
     transition to run: the light would just appear. */
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('lit')));
}

function stopCelebration() {
  const el = document.getElementById('spotlight');
  if (!el) return;

  el.classList.remove('lit');
  /* Let it fade back out before taking it off the compositor, but
     only if nothing has re-lit it in the meantime. */
  clearTimeout(spotTimer);
  spotTimer = setTimeout(() => {
    if (!el.classList.contains('lit')) el.style.display = 'none';
  }, spotFade ? 1400 : 0);
}

/* ── Frame meter (?debug=1 only) ──
   Gated, because a requestAnimationFrame loop on the live URL would
   add the per-frame main-thread work this design exists to avoid.
   It samples the MAIN thread: if it reads 60 while the wall still
   looks rough, the bottleneck is downstream of this page — the
   player's compositor, or the panel's own scaler. */
let fpsRaf = null, fpsFrames = 0, fpsMark = 0;

function startFpsMeter() {
  if (fpsRaf || !dbg) return;
  fpsMark = performance.now();
  fpsFrames = 0;
  const tick = (now) => {
    fpsFrames++;
    if (now - fpsMark >= 1000) {
      dbgCf = 'player · ' + Math.round(1000 * fpsFrames / (now - fpsMark)) +
              'fps main thread · celebration is a held state';
      renderDebug();
      fpsMark = now;
      fpsFrames = 0;
    }
    fpsRaf = requestAnimationFrame(tick);
  };
  fpsRaf = requestAnimationFrame(tick);
}

/* The display can sit untouched for hours, and some players suspend a
   background tab hard enough to leave the board on a stale number. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadAll();
});

/* ── Rehearsal hooks (URL-only, nothing on the keyboard) ──
   ?celebrate=1  light the spotlight immediately on load
                 (?confetti=1 still works — it's in the old notes)
   ?goal=25      lower the scoreboard goal for a dry run
   ?debug=1      show floor / host / caps, plus the player's frame rate
   ?spotlight=0  no celebration at all, just the board
   ?fade=0       snap to the lit state with no transition, for a player
                 that can't even manage the fade
   None of these can be triggered by accident — the live URL stays
   clean.  */
const _q = new URLSearchParams(location.search);
if (_q.get('goal')) {
  const g = parseInt(_q.get('goal'), 10);
  if (g > 0) { goalOverride = g; cfg.goal = g; }
}
if (_q.get('debug')) {
  dbg = document.getElementById('debug');
  dbg.style.display = 'block';
  startFpsMeter();
}
if (_q.get('spotlight') === '0') spotlightOn = false;
if (_q.get('fade') === '0') {
  spotFade = false;
  document.getElementById('spotlight').classList.add('nofade');
}
if (_q.get('celebrate') || _q.get('confetti')) startCelebration();

loadAll();
/* Re-read the table and the config every 15s. Realtime is the fast path,
   but if the socket drops silently the display would otherwise sit on a
   stale number for the rest of the event with a green dot still showing.
   It also re-reads the goal, so changing it in the admin console reaches
   the wall within fifteen seconds without touching the display. */
setInterval(loadAll, 15000);
</script>
