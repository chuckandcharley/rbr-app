<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready Bag Rally</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:400,600,700,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#00b0ff;--gold:#00b0ff;--bg:#002d50;
  --ff:'Source Sans 3','Arial Narrow',Arial,sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--ff);overflow:hidden;color:#fff;}

#layout{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;position:relative;padding:64px;}

#event-label{font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:18px;}
#total-label{
  font-size:clamp(48px,6vw,96px);font-weight:600;letter-spacing:.06em;
  color:rgba(255,255,255,.4);line-height:1;text-align:center;
  margin-bottom:16px;
}
/* The lower bound used to be 200px, set when the number topped out at
   "1,000" — five glyphs. "16,000" is six, so on any window under about
   900px the number pushed past the padding and got clipped by
   overflow:hidden. Only the min changed; on a wall display 22vw still
   wins, so the projected size is exactly as before. */
#total-num{
  font-size:clamp(96px,22vw,420px);font-weight:900;letter-spacing:-.04em;
  color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-align:center;
  transition:transform .12s cubic-bezier(0.34,1.6,0.64,1);
}
#total-num.bump{transform:scale(1.05);}
#total-goal{font-size:34px;font-weight:700;color:rgba(255,255,255,.4);margin-top:16px;}

#progress-wrap{width:100%;max-width:900px;margin-top:56px;}
#progress-track{height:18px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
#progress-fill{height:100%;background:var(--blue);border-radius:99px;width:0%;transition:width .6s cubic-bezier(0.4,0,0.2,1);}
#progress-pct{font-size:22px;font-weight:700;color:rgba(255,255,255,.4);margin-top:14px;letter-spacing:.06em;text-align:right;}

/* SPONSOR LOGO
   The wordmark's navy (#264665) sits at about 1.4:1 against the board's
   background (#002d50), so on bare navy "Atlantic Bay" all but vanishes
   and only the lighter blue survives. A blurred white glow behind it
   rescues the navy but washes out the light-blue "Mortgage Group" and
   reads as a smudge at projection size, so the logo gets a solid white
   plate instead — which is also how the full-colour asset is meant to
   be used. The image is embedded as a data URI, so this file still
   deploys on its own with no second asset to host. */
#sponsor-plate{
  margin-top:clamp(20px,3.4vh,44px);
  padding:clamp(11px,1.7vh,22px) clamp(18px,2.8vh,34px);
  background:#fff;border-radius:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
}
/* Sized by height rather than width, so the plate scales against the
   vertical space it shares with the number, not against window width.
   The 86px ceiling lands it at roughly a fifth of the capped number
   height, which keeps the sponsor clearly secondary on a big wall. */
#sponsor-plate img{display:block;height:clamp(30px,6.6vh,86px);width:auto;}

/* Same reasoning as the min on #total-num: on a short viewport the board
   already nearly fills the height, so the plate gives way instead of
   pushing the top of the stack into overflow:hidden. */
@media (max-height:800px){
  #sponsor-plate{margin-top:11px;padding:7px 13px;border-radius:9px;}
  #sponsor-plate img{height:32px;}
}

/* Spot-checking the display on a phone shouldn't look broken. */
@media (max-width:700px){
  #layout{padding:24px;}
  #total-goal{font-size:20px;}
  #progress-wrap{margin-top:32px;}
}

/* CONFETTI */

/* width/height 100% is load-bearing, not decoration. A <canvas> is a
   replaced element with an intrinsic size, so position:fixed + inset:0
   alone does NOT stretch it — the browser uses the backing-store size
   and pins it top-left. That's what caused confetti to cover only part
   of the screen after entering fullscreen. */
#confetti-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;}

/* CONNECTION */
#conn{position:fixed;bottom:14px;right:16px;width:8px;height:8px;border-radius:50%;background:#3a3;transition:background .3s;}
#conn.off{background:#a33;}

/* Rehearsal-only readout (?debug=1). Never shown on the live URL. */
#debug{
  position:fixed;bottom:12px;left:16px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.35);letter-spacing:.04em;display:none;
  font-variant-numeric:tabular-nums;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://advjuonmfxpjxxgmoycx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdmp1b25tZnhwanh4Z21veWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NzkyMjQsImV4cCI6MjA5NTU1NTIyNH0.hgAlqocR8DSTHNGg_fdG6nWW6NQ6t_K2RD7D4sdXPGc';

/* ── EVENT CONFIG ──
   Everything that can change on the day — the goal, which row is the
   host's hidden pad — lives in the `event_config` row in Supabase, so
   the wall display never needs re-deploying to change it. */

let counts = {};          // keyed by line id, so any number of lines works
let lastTotal = -1;
let lastPct = '';
let lastBump = 0;
let celebrationFired = false;

let cfg = { goal: 16000, force: false, hostLine: 41, floorCap: 15995 };
let goalOverride = null;  // set by ?goal=N for rehearsals
let dbg = null;           // set by ?debug=1

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* ── Data ────────────────────────────────────────────────── */

async function loadAll() {
  const [lines, board] = await Promise.all([
    sb.from('lines').select('id, count').order('id'),
    sb.rpc('scoreboard')
  ]);

  if (lines.error) console.error(lines.error);
  else if (lines.data) {
    /* Rebuild rather than merge, so a row deleted in Supabase actually
       disappears from the board instead of lingering in the total. */
    const fresh = {};
    lines.data.forEach(r => { fresh[r.id] = r.count || 0; });
    counts = fresh;
  }

  if (board.error) console.error(board.error);
  else if (board.data) applyConfig(board.data);

  applyState();
}

function applyConfig(s) {
  if (!s) return;
  cfg.goal     = goalOverride || s.goal || 16000;
  cfg.force    = !!s.force_celebrate;
  cfg.hostLine = s.host_line ?? 41;
  cfg.floorCap = s.floor_cap ?? cfg.goal;
}

const conn = document.getElementById('conn');

sb.channel('rbr-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'lines' },
    (payload) => {
      /* '*' rather than 'UPDATE' so a row added mid-event — the host line,
         a row someone forgot to seed — starts counting without needing the
         display refreshed. DELETE carries no payload.new, hence the guard. */
      const row = payload.new;
      if (!row || row.id == null) return;
      counts[row.id] = row.count || 0;
      scheduleApply();
    }
  )
  .on('postgres_changes', { event: '*', schema: 'public', table: 'event_config' },
    (payload) => { if (payload.new) loadAll(); }
  )
  .subscribe((status) => {
    conn.classList.toggle('off', status !== 'SUBSCRIBED');
  });

/* 41 lines tapping at once can land dozens of realtime events per second,
   and the old code ran a full repaint on every one. This collapses a
   burst into one repaint per frame — same numbers, none of the thrash. */
let applyQueued = false;
function scheduleApply() {
  if (applyQueued) return;
  applyQueued = true;
  requestAnimationFrame(() => { applyQueued = false; applyState(); });
}

function applyState() {
  const goal = cfg.goal || 16000;
  let sum = 0;
  for (const k in counts) sum += counts[k] || 0;
  const total = Math.min(sum, goal);

  if (total !== lastTotal) {
    const el = document.getElementById('total-num');
    el.textContent = total.toLocaleString();
    /* Throttled past the 220ms animation. Un-throttled, a heavy rush
       re-added the class before the old timer cleared it and the number
       just sat at 1.05 scale for the whole push, so the pop stopped
       reading as a pop. */
    const now = performance.now();
    if (now - lastBump > 240) {
      lastBump = now;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 220);
    }
  }

  const pct = Math.min(100, (total / goal) * 100);
  const pctStr = pct.toFixed(1) + '%';
  if (pctStr !== lastPct) {
    lastPct = pctStr;
    document.getElementById('progress-fill').style.width = pct.toFixed(2) + '%';
    document.getElementById('progress-pct').textContent = pctStr;
  }

  const shouldCelebrate = total >= goal || cfg.force;
  if (shouldCelebrate && !celebrationFired) {
    celebrationFired = true;
    startConfetti();
  } else if (!shouldCelebrate && celebrationFired) {
    celebrationFired = false;
    stopConfetti();
  }

  if (dbg) {
    const host = counts[cfg.hostLine] || 0;
    dbg.textContent =
      'floor ' + (sum - host).toLocaleString() +
      ' · host ' + host.toLocaleString() +
      ' · floor stops at ' + cfg.floorCap.toLocaleString() +
      ' · goal ' + goal.toLocaleString();
  }

  lastTotal = total;
}

/* ════════════════════════════════════════════════════════════
   CONFETTI — hardened for big walls and low-power players
   ────────────────────────────────────────────────────────────
   Four things went wrong before, all fixed here:
   1. Motion was per-FRAME (p.y += p.vy), so a slow frame froze the
      fall mid-air and resumed from the same spot. Now it's per-SECOND
      with a clamp, so a hitch becomes a brief slow-down, never a
      freeze and never a teleport.
   2. The backing store was window-sized, so a 4K player made us clear
      and repaint 8.3M pixels a frame. Now it's capped; CSS upscales.
   3. Size was read once at start, so resizing or going fullscreen left
      confetti stranded in a corner. Now it re-fits itself every frame.
   4. Every recycled particle allocated a new object AND a new color
      array, feeding the GC. Now the pool is fixed and reused in place.
   ════════════════════════════════════════════════════════════ */

const CONFETTI_COLORS = ['#00b0ff','#004270','#0378ad','#ffffff','#f3f9fd','#7fd4ff'];
const CONFETTI_MAX = 260;          // pool ceiling — never allocated past this
const CONFETTI_MIN_ACTIVE = 60;    // floor the auto-throttle won't go below
const MAX_BACKING_PX = 2600000;    // ~1080p at 1.5x — the per-frame pixel budget

const cf = {
  canvas: null, ctx: null,
  pool: [], active: 0,
  w: 0, h: 0, scale: 1, sizeScale: 1,
  running: false, raf: null, last: 0, slowFrames: 0
};

/* Fit the canvas to the viewport. Called on load, on resize/fullscreen,
   and defensively from inside the frame loop — some browsers (and most
   TV/stick browsers) never fire a resize event on a fullscreen change,
   which is exactly why the old version needed a manual refresh. */
function fitConfetti() {
  const c = cf.canvas;
  if (!c) return;
  const cssW = Math.max(1, window.innerWidth);
  const cssH = Math.max(1, window.innerHeight);

  // Respect DPR up to 2x, then shrink to stay inside the pixel budget.
  let scale = Math.min(window.devicePixelRatio || 1, 2);
  const px = cssW * cssH * scale * scale;
  if (px > MAX_BACKING_PX) scale *= Math.sqrt(MAX_BACKING_PX / px);
  scale = Math.max(0.25, scale);

  const bw = Math.round(cssW * scale);
  const bh = Math.round(cssH * scale);
  if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }

  const oldW = cf.w, oldH = cf.h;
  cf.w = cssW; cf.h = cssH; cf.scale = scale;

  // Bigger screen = bigger, faster flakes, so they read the same from
  // the back of the room instead of turning into 6px dust.
  cf.sizeScale = Math.min(2.5, Math.max(0.8, Math.min(cssW, cssH) / 800));

  // Density from area, not a hardcoded 220.
  const want = Math.round((cssW * cssH) / 14000);
  cf.active = Math.min(CONFETTI_MAX, Math.max(90, want));

  // Grow the pool once; entries are reused forever after.
  while (cf.pool.length < CONFETTI_MAX) cf.pool.push({});

  // Keep in-flight particles where they were, proportionally.
  if (oldW && oldH) {
    const fx = cssW / oldW, fy = cssH / oldH;
    for (let i = 0; i < cf.pool.length; i++) {
      const p = cf.pool[i];
      if (p.x === undefined) continue;
      p.x *= fx; p.y *= fy;
    }
  }

  // Setting .width resets all context state, so re-establish it after.
  cf.ctx = c.getContext('2d');
  cf.ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

/* Reuse an existing object — no allocation, no garbage, no GC pauses.
   Velocities are px/sec and rad/sec, matching the old 60fps feel. */
function resetParticle(p, spread) {
  const s = cf.sizeScale;
  p.x = Math.random() * cf.w;
  p.y = spread ? Math.random() * cf.h : -20 - Math.random() * cf.h * 0.3;
  p.w = (6 + Math.random() * 8) * s;
  p.h = (10 + Math.random() * 6) * s;
  p.color = CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0];
  p.rot = Math.random() * Math.PI * 2;
  p.rotV = (Math.random() - 0.5) * 7.2;
  p.vx = (Math.random() - 0.5) * 150 * s;
  p.vy = (150 + Math.random() * 210) * s;
  p.opacity = 0.85 + Math.random() * 0.15;
}

function startConfetti() {
  if (cf.running) return;
  cf.canvas = document.getElementById('confetti-canvas');
  fitConfetti();
  for (let i = 0; i < cf.pool.length; i++) resetParticle(cf.pool[i], true);
  cf.running = true;
  cf.last = performance.now();
  cf.slowFrames = 0;
  cf.raf = requestAnimationFrame(confettiFrame);
}

function stopConfetti() {
  cf.running = false;
  if (cf.raf) cancelAnimationFrame(cf.raf);
  cf.raf = null;
  if (cf.ctx) cf.ctx.clearRect(0, 0, cf.w, cf.h);
}

function confettiFrame(now) {
  if (!cf.running) return;

  // Catch a fullscreen/resolution change even with no resize event.
  if (window.innerWidth !== cf.w || window.innerHeight !== cf.h) fitConfetti();

  let dt = (now - cf.last) / 1000;
  cf.last = now;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > 0.05) dt = 0.05;   // the anti-teleport clamp

  // Watchdog: if the machine genuinely can't keep up, thin the confetti
  // rather than letting it stutter. Downgrade only, so it never flaps.
  if (dt * 1000 > 33) {
    if (++cf.slowFrames > 90 && cf.active > CONFETTI_MIN_ACTIVE) {
      cf.active = Math.max(CONFETTI_MIN_ACTIVE, Math.round(cf.active * 0.8));
      cf.slowFrames = 0;
    }
  } else if (cf.slowFrames > 0) {
    cf.slowFrames--;
  }

  const ctx = cf.ctx, s = cf.scale;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, cf.w, cf.h);

  for (let i = 0; i < cf.active; i++) {
    const p = cf.pool[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotV * dt;
    // Wrap sideways instead of letting drift carry flakes off the edges
    // forever — over a long celebration that quietly thinned the middle.
    if (p.x < -40) p.x += cf.w + 80;
    else if (p.x > cf.w + 40) p.x -= cf.w + 80;
    if (p.y > cf.h + 20) resetParticle(p, false);

    // One setTransform instead of save/translate/rotate/restore.
    const cos = Math.cos(p.rot), sin = Math.sin(p.rot);
    ctx.setTransform(s * cos, s * sin, -s * sin, s * cos, s * p.x, s * p.y);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
  }

  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.globalAlpha = 1;
  cf.raf = requestAnimationFrame(confettiFrame);
}

// Size the canvas up front so the first celebration frame is already
// correct, and re-fit on every event that can change the viewport.
cf.canvas = document.getElementById('confetti-canvas');
fitConfetti();
['resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, fitConfetti));
document.addEventListener('fullscreenchange', fitConfetti);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitConfetti);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { cf.last = performance.now(); fitConfetti(); loadAll(); }
});

/* ── Rehearsal hooks (URL-only, nothing on the keyboard) ──
   ?confetti=1  start the celebration immediately on load
   ?goal=25     lower the scoreboard goal for a dry run
   ?debug=1     show floor / host / caps in the corner
   Neither can be triggered by accident — the live URL stays clean.  */
const _q = new URLSearchParams(location.search);
if (_q.get('goal')) {
  const g = parseInt(_q.get('goal'), 10);
  if (g > 0) { goalOverride = g; cfg.goal = g; }
}
if (_q.get('debug')) { dbg = document.getElementById('debug'); dbg.style.display = 'block'; }
if (_q.get('confetti')) startConfetti();

loadAll();
/* Re-read the table and the config every 15s. Realtime is the fast path,
   but if the socket drops silently the display would otherwise sit on a
   stale number for the rest of the event with a green dot still showing.
   It also re-reads the goal, so changing it in the admin console reaches
   the wall within fifteen seconds without touching the display. */
setInterval(loadAll, 15000);
</script>
</body>
